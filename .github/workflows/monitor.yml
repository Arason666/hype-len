name: Check HYPE relative-strength signals

on:
  schedule:
    # Run shortly after each 15-minute candle closes (UTC).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description: "Send a test alert even when no signal is triggered"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hype-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Evaluate closed candles
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALERT: ${{ inputs.force_alert && '1' || '0' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python3 scripts/monitor.py

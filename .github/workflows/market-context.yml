name: Collect HYPE market context

on:
  schedule:
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hype-market-context
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect public market structure
        id: collect
        run: python3 scripts/market_context.py

      - name: Validate dashboard
        run: python3 scripts/validate_site.py

      - name: Persist market context
        run: |
          git config user.name "hype-lens-bot"
          git config user.email "hype-lens-bot@users.noreply.github.com"
          git add site/data/market-context.json
          if git diff --cached --quiet; then
            echo "No new market-context bucket to persist."
          else
            git commit -m "Update HYPE market context [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report retained samples
        run: |
          echo "Market snapshots: ${{ steps.collect.outputs.snapshots }}"
          echo "Funding points: ${{ steps.collect.outputs.funding_points }}"

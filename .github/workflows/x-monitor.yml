name: Collect paid X opinions

on:
  schedule:
    # Run shortly after the existing 15-minute market monitor (UTC).
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paid-x-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Collect and analyze new public posts
        id: collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_DAILY_POST_LIMIT: "20"
          X_DAILY_COST_LIMIT_USD: "0.15"
        run: python3 scripts/x_monitor.py

      - name: Validate dashboard
        if: steps.collect.outputs.changed == 'true'
        run: python3 scripts/validate_site.py

      - name: Persist public data and budget ledger
        if: steps.collect.outputs.changed == 'true'
        run: |
          git config user.name "hype-lens-bot"
          git config user.email "hype-lens-bot@users.noreply.github.com"
          git add data/x-monitor-state.json site/data/x-posts.json
          git commit -m "Update paid X opinion feed [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        if: steps.collect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy dashboard
        if: steps.collect.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report guarded usage
        run: |
          echo "New posts: ${{ steps.collect.outputs.new_posts }}"
          echo "Estimated daily X spend: USD ${{ steps.collect.outputs.estimated_cost_usd }} / USD 0.15"
